name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore angular_asp_core_web_api.sln

      - name: Build
        run: dotnet build angular_asp_core_web_api.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test DocuManagementApp.Tests/DocuManagementApp.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angClientapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angClientapp/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (production)
        run: npm run build:prod
        env:
          API_URL: ${{ vars.API_URL }}
          SPA_REDIRECT_URI: ${{ vars.SPA_REDIRECT_URI }}

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: |
          terraform init -backend=false
          terraform validate

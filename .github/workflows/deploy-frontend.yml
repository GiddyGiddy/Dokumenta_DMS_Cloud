name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "angClientapp/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angClientapp/package-lock.json

      - name: Install
        working-directory: angClientapp
        run: npm ci

      - name: Build (production)
        working-directory: angClientapp
        run: npm run build:prod
        env:
          API_URL: ${{ vars.API_URL }}
          SPA_REDIRECT_URI: ${{ vars.SPA_REDIRECT_URI || 'https://documenta.giddyitsolutions.com' }}

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: angClientapp/dist/angClientapp/browser
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.SPA_REDIRECT_URI || 'https://documenta.giddyitsolutions.com' }}/")
            echo "status=$code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 6
          done
          exit 1
